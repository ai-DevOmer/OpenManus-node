<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMAR AGENT - Web Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .typing-indicator span {
            animation: blink 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0% { opacity: 0.1; }
            20% { opacity: 1; }
            100% { opacity: 0.1; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">
    <div class="container mx-auto max-w-4xl p-4 flex-grow flex flex-col h-screen">
        <header class="mb-4 text-center">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-600">
                OMAR AGENT
            </h1>
            <p class="text-sm text-gray-400">Powered by Gemini 2.5 Flash</p>
        </header>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-grow bg-gray-800 rounded-lg shadow-xl overflow-y-auto p-4 mb-4 space-y-4 border border-gray-700">
            <!-- Welcome Message -->
            <div class="flex items-start">
                <div class="bg-blue-600 rounded-lg p-3 max-w-[80%]">
                    <p class="text-sm">Hello! I am OMAR AGENT. I can help you with planning, searching, and general questions. Note: Since I am running in a web environment, some system capabilities (like file system access or executing local scripts) are limited. How can I help you today?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" 
                class="flex-grow bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 transition-colors"
                placeholder="Type your message..." autocomplete="off">
            <button type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed">
                Send
            </button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const submitButton = chatForm.querySelector('button');

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `flex items-start ${role === 'user' ? 'justify-end' : ''}`;
            
            const bubble = document.createElement('div');
            bubble.className = `rounded-lg p-3 max-w-[80%] ${role === 'user' ? 'bg-purple-600' : 'bg-gray-700'}`;
            
            const p = document.createElement('p');
            p.className = 'text-sm whitespace-pre-wrap';
            p.textContent = text;
            
            bubble.appendChild(p);
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addLoading() {
            const div = document.createElement('div');
            div.id = 'loading-indicator';
            div.className = 'flex items-start';
            div.innerHTML = `
                <div class="bg-gray-700 rounded-lg p-3">
                    <div class="typing-indicator flex space-x-1">
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Disable input
            userInput.value = '';
            userInput.disabled = true;
            submitButton.disabled = true;

            // Add user message
            addMessage('user', text);

            // Add loading
            const loading = addLoading();

            try {
                const response = await fetch('/api/agent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                
                // Remove loading
                loading.remove();

                if (data.error) {
                    addMessage('assistant', 'Error: ' + data.error);
                } else {
                    addMessage('assistant', data.result);
                }
            } catch (error) {
                loading.remove();
                addMessage('assistant', 'Network Error: ' + error.message);
            } finally {
                // Re-enable input
                userInput.disabled = false;
                submitButton.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
